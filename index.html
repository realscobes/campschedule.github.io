<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer Camp 2026</title>
  <link rel="stylesheet" href="schedule.css" />
</head>
<body>

  <div class="sticky-header">
    <h1>Summer Camp 2026</h1>
    <div class="tabs-bar" role="tablist" id="tabs-bar"></div>
  </div>

  <div class="table-wrapper">
    <div id="tables-container"></div>
  </div>

  <div class="bottom-bar" id="bottom-bar" hidden>
    <span class="bottom-bar-label" id="bottom-bar-label">Up Next</span>
    <span class="bottom-bar-title" id="bottom-bar-title"></span>
    <span class="bottom-bar-countdown" id="bottom-bar-countdown"></span>
  </div>

  <script>
    let SCHEDULE = [];

    function parseMins(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function localDateStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function fmt12(hhmm) {
      let [h, m] = hhmm.split(':').map(Number);
      const ampm = h < 12 ? 'AM' : 'PM';
      if (h === 0) h = 12;
      else if (h > 12) h -= 12;
      return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    function isNowPlaying(startMins, endMins, nowMins) {
      if (endMins > startMins) return nowMins >= startMins && nowMins < endMins;
      return nowMins >= startMins; // crosses midnight: only true once film has started
    }

    function switchTab(idx) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
        btn.setAttribute('aria-selected', String(i === idx));
      });
      document.querySelectorAll('.day-table').forEach((tbl, i) => {
        tbl.classList.toggle('active', i === idx);
      });

      // Scroll to active row if this is its day, otherwise first row of the day
      const activeRow = document.querySelector('tr.now-playing')
        || document.querySelector('.up-next-badge')?.closest('tr');
      const tables = [...document.querySelectorAll('.day-table')];
      const activeIdx = activeRow ? tables.indexOf(activeRow.closest('.day-table')) : -1;
      if (activeIdx === idx && activeRow) {
        scrollToRow(activeRow, 'start');
      } else {
        const isMobile = window.innerWidth <= 480;
        if (isMobile) {
          const firstRow = document.querySelector(`#day-${idx} tbody tr`);
          if (firstRow) scrollToRow(firstRow, 'start');
        } else {
          const theadRow = document.querySelector(`#day-${idx} thead tr`);
          if (theadRow) scrollToRow(theadRow, 'start');
        }
      }
    }

    function highlight() {
      const now          = new Date();
      const todayStr     = localDateStr(now);
      const yd           = new Date(now);
      yd.setDate(yd.getDate() - 1);
      const yesterdayStr = localDateStr(yd);
      const tm           = new Date(now);
      tm.setDate(tm.getDate() + 1);
      const tomorrowStr  = localDateStr(tm);
      const nowMins      = now.getHours() * 60 + now.getMinutes();

      let anyPlaying = false;
      let playingRow = null;
      let playingDay = null;

      SCHEDULE.forEach((day, i) => {
        document.querySelectorAll(`#day-${i} tbody tr`).forEach(row => {
          const startMins = parseMins(row.dataset.start);
          const endMins   = parseMins(row.dataset.end);
          let playing = false;
          if (day.date === todayStr) {
            playing = isNowPlaying(startMins, endMins, nowMins);
          } else if (day.date === yesterdayStr && endMins < startMins) {
            // Overnight film from yesterday still running into today's early hours
            playing = nowMins < endMins;
          }
          if (playing) { anyPlaying = true; playingRow = row; playingDay = day; }

          row.classList.toggle('now-playing', playing);

          const titleCell = row.cells[0];
          const existing  = titleCell.querySelector('.now-playing-badge');
          if (playing && !existing) {
            const badge = document.createElement('span');
            badge.className = 'now-playing-badge';
            badge.textContent = 'Now playing';
            titleCell.appendChild(badge);
          } else if (!playing && existing) {
            existing.remove();
          }
          // Clear any stale up-next badge each pass
          titleCell.querySelector('.up-next-badge')?.remove();
        });
      });

      // Update bottom bar
      if (anyPlaying && playingRow) {
        const startMins = parseMins(playingRow.dataset.start);
        const endMins   = parseMins(playingRow.dataset.end);
        let endDateStr;
        if (playingDay.date === yesterdayStr) {
          endDateStr = todayStr;    // overnight film ends today
        } else if (endMins < startMins) {
          endDateStr = tomorrowStr; // today's film crosses midnight
        } else {
          endDateStr = playingDay.date;
        }
        const bar = document.getElementById('bottom-bar');
        document.getElementById('bottom-bar-label').textContent = 'Now Playing';
        document.getElementById('bottom-bar-title').textContent = playingRow.dataset.title;
        bar.dataset.targetMins = endMins;
        bar.dataset.targetDate = endDateStr;
        bar.removeAttribute('hidden');
        document.body.classList.add('has-bottom-bar');
        updateCountdown();
      }
      if (!anyPlaying) {
        let found = false;
        SCHEDULE.forEach((day, i) => {
          if (found) return;
          day.films.forEach((f, j) => {
            if (found) return;
            const startMins  = parseMins(f.start);
            const isUpcoming =
              day.date > todayStr ||
              (day.date === todayStr && startMins > nowMins);
            if (isUpcoming) {
              found = true;
              const row = document.querySelector(`#day-${i} tbody tr:nth-child(${j + 1})`);
              if (row) {
                const badge = document.createElement('span');
                badge.className = 'up-next-badge';
                badge.textContent = 'Up Next';
                row.cells[0].appendChild(badge);
                const bar = document.getElementById('bottom-bar');
                document.getElementById('bottom-bar-label').textContent = 'Up Next';
                document.getElementById('bottom-bar-title').textContent = f.title;
                bar.dataset.targetMins = parseMins(f.start);
                bar.dataset.targetDate = day.date;
                bar.removeAttribute('hidden');
                document.body.classList.add('has-bottom-bar');
                updateCountdown();
              }
            }
          });
        });
        if (!found) {
          document.getElementById('bottom-bar').setAttribute('hidden', '');
          document.body.classList.remove('has-bottom-bar');
        }
      }
    }

    function updateCountdown() {
      const bar = document.getElementById('bottom-bar');
      if (bar.hidden) return;
      const targetMins = +bar.dataset.targetMins;
      const targetDate = bar.dataset.targetDate;
      const now        = new Date();
      const nowSecs    = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const todayStr   = localDateStr(now);
      let deltaSecs;
      if (targetDate === todayStr) {
        deltaSecs = targetMins * 60 - nowSecs;
      } else {
        deltaSecs = (24 * 60 - (nowSecs / 60)) * 60 + targetMins * 60;
      }
      if (deltaSecs <= 0) {
        highlight();
        return;
      }
      const m = Math.floor(deltaSecs / 60);
      const s = deltaSecs % 60;
      document.getElementById('bottom-bar-countdown').textContent = `${m}:${String(s).padStart(2, '0')}`;
    }

    function scrollToRow(row, block = 'center') {
      const headerH = document.querySelector('.sticky-header')?.offsetHeight ?? 0;
      const rect    = row.getBoundingClientRect();
      if (block === 'start') {
        window.scrollBy({ top: rect.top - headerH - 16, behavior: 'smooth' });
      } else {
        const visibleH = window.innerHeight - headerH;
        window.scrollBy({ top: rect.top - headerH - visibleH / 2 + rect.height / 2, behavior: 'smooth' });
      }
    }

    function scrollToActive() {
      const row = document.querySelector('tr.now-playing')
        || document.querySelector('.up-next-badge')?.closest('tr');
      if (row) scrollToRow(row, 'center');
    }

    function buildTables() {
      const tabsBar   = document.getElementById('tabs-bar');
      const container = document.getElementById('tables-container');
      tabsBar.innerHTML = '';
      container.innerHTML = '';
      const todayStr  = localDateStr(new Date());
      let activeIdx   = SCHEDULE.findIndex(d => d.date === todayStr);
      if (activeIdx === -1) activeIdx = 0;

      SCHEDULE.forEach((day, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === activeIdx ? ' active' : '');
        btn.textContent = day.label.split(' ')[0];
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', String(i === activeIdx));
        btn.addEventListener('click', () => switchTab(i));
        tabsBar.appendChild(btn);

        const table = document.createElement('table');
        table.id = `day-${i}`;
        table.className = 'day-table' + (i === activeIdx ? ' active' : '');
        table.setAttribute('role', 'tabpanel');
        table.innerHTML = `
          <thead><tr><th>Title</th><th>Start</th><th>End</th><th>Location</th></tr></thead>
          <tbody>${day.films.map(f => `
            <tr data-start="${f.start}" data-end="${f.end}" data-title="${f.title}">
              <td>${f.title}</td>
              <td data-label="Start"><span class="time time-single">${fmt12(f.start)}</span><span class="time-range"><span class="time">${fmt12(f.start)}</span> – <span class="time">${fmt12(f.end)}</span></span></td>
              <td data-label="End"><span class="time">${fmt12(f.end)}</span></td>
              <td data-label="Location"><span class="loc loc-${f.location.toLowerCase()}">${f.location}</span></td>
            </tr>`).join('')}
          </tbody>`;
        container.appendChild(table);
      });
    }

    function fitHeaderPadding() {
      const hdr = document.querySelector('.sticky-header');
      document.body.style.paddingTop = hdr.offsetHeight + 'px';
    }
    fetch('schedule.json')
      .then(r => r.json())
      .then(data => {
        SCHEDULE = data;
        buildTables();
        fitHeaderPadding();
        window.addEventListener('resize', fitHeaderPadding);
        highlight();
        scrollToActive();
        setInterval(() => {
          fetch('schedule.json')
            .then(r => r.json())
            .then(data => {
              if (JSON.stringify(data) !== JSON.stringify(SCHEDULE)) {
                SCHEDULE = data;
                buildTables();
              }
              highlight();
            });
        }, 60_000);
        setInterval(updateCountdown, 1_000);
      });
  </script>
</body>
</html>
